<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak | Mochi Daifuku </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="home.html">🏠 Home</a>
        <a href="about.html">🍡 About</a>
        <a href="contact.html">💌 Contact</a>
    </nav>

    <div class="contact">
        <div class="contact-icon">💗</div>

        <h1>Hubungi Kami</h1>
        <p class="contact-desc">
            Ada pertanyaan atau ingin memesan Daifuku?
            Yuk, ngobrol dengan kami! 🧁
        </p>

        <form>
            <label for="nama">🌷 Nama Lengkap</label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama kamu..."
                required
            >

            <label for="email">💌 Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="contoh@email.com"
                required
            >

            <label for="telepon">📞 No. Telepon</label>
            <input
                type="tel"
                id="telepon"
                name="telepon"
                placeholder="Masukkan nomor telepon..."
                required
            >

            <label for="pesan">🎀 Pesan Kamu</label>
            <textarea
                id="pesan"
                name="pesan"
                rows="4"
                placeholder="Tulis pesan atau pesanan daifuku kamu..."
                required
            ></textarea>

            <button type="submit">Kirim Pesan 💕</button>
        </form>

        <p class="contact-footer">
            Made with love & sugar ♡ Mochi Daifuku
        </p>
    </div>

</body>
</html>
